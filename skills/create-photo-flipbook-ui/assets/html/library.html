<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2eb"><title>我的相册书柜</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="library.css?v=2">
</head>
<body>
<main class="library-shell">
  <header class="library-header">
    <div><span class="eyebrow">THE PHOTO LIBRARY</span><h1>把时光，收藏成书。</h1><p>一本相册，一段值得翻阅的记忆。</p></div>
    <button class="primary" id="create-book" type="button">＋ 创建相册</button>
  </header>
  <section class="collection" aria-labelledby="collection-title">
    <div class="collection-heading"><h2 id="collection-title">我的书柜 <span id="book-count">0 本</span></h2><div class="collection-tools"><label class="search-box"><span class="sr-only">搜索相册</span><input id="book-search" type="search" placeholder="搜索标题" autocomplete="off"></label><label class="sort-box"><span class="sr-only">排序方式</span><select id="book-sort"><option value="newest">最新创建</option><option value="oldest">最早创建</option><option value="title">按标题</option></select></label><button class="quiet-button" id="export-books" type="button">导出书柜</button><button class="quiet-button" id="import-books" type="button">导入书柜</button><input id="import-file" type="file" accept="application/json" hidden></div></div>
    <p id="filter-status" class="filter-status" aria-live="polite"></p>
    <div id="library-loading" role="status">正在打开书柜…</div>
    <div id="empty-shelf" class="empty-shelf" hidden><div class="empty-books" aria-hidden="true"><i></i><i></i><i></i></div><h3>第一段故事，从这里开始。</h3><p>选择照片、写下标题，把你的第一本相册放上书柜。</p><button class="primary" id="create-first" type="button">创建第一本相册</button></div>
    <ol id="shelf" class="shelf" aria-label="相册书柜"></ol>
  </section>
  <p id="library-message" class="message" role="status" aria-live="polite"></p>
  <footer class="library-footer"><span>照片、相册和文字保存在此浏览器中。</span><span>打开书本，随时修改每页文字。</span></footer>
  <noscript>请启用 JavaScript 后使用书柜。</noscript>
</main>
<dialog id="create-dialog" aria-labelledby="create-title">
  <form id="create-form">
    <div class="dialog-heading"><h2 id="create-title">新的一本相册</h2><button type="button" class="icon-button" id="cancel-create" aria-label="关闭创建相册">×</button></div>
    <label for="album-title">相册标题</label><input id="album-title" name="title" maxlength="80" placeholder="例如：秋天的旅行" required>
    <label for="album-photos">添加照片 <span class="muted">可多选，也可先创建空白相册</span></label>
    <input id="album-photos" name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple>
    <p class="hint">支持 JPG、PNG、WebP、GIF 和 AVIF，最多 100 张。照片按选择顺序各占一页，创建后可为每页添加文字。</p>
    <p id="photo-selection" class="selection" aria-live="polite">尚未选择照片</p>
    <p id="create-error" class="error" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="secondary" id="cancel-create-bottom">取消</button><button type="submit" class="primary" id="save-new-book">创建并放入书柜</button></div>
  </form>
</dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <form id="delete-form">
    <h2 id="delete-title">从书柜移除这本相册？</h2><p id="delete-description"></p><p class="hint">相册和文字将从此浏览器删除，原始照片文件不受影响。</p>
    <p id="delete-error" class="error" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="secondary" id="cancel-delete">保留相册</button><button type="submit" class="danger" id="confirm-delete">删除相册</button></div>
  </form>
</dialog>
<script type="module" src="library.mjs"></script>
</body>
</html>
